<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>虎校 LP 管台</title>
  <style>
    :root {
      --primary: #1677ff;
      --primary-hover: #4096ff;
      --success: #12a66a;
      --warning: #f59e0b;
      --danger: #e5484d;
      --purple: #7c3aed;
      --text: #1f2329;
      --sub-text: #646a73;
      --muted: #8f959e;
      --line: #e5e6eb;
      --bg: #f5f7fa;
      --card: #ffffff;
      --sidebar: #101828;
      --sidebar-active: #1d2939;
      --blue-bg: #e8f3ff;
      --green-bg: #f0f9eb;
      --orange-bg: #fff7e6;
      --red-bg: #fff1f0;
      --purple-bg: #f3ecff;
      --gray-bg: #f2f3f5;
      --shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 8px 24px rgba(16, 24, 40, 0.08);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      font-size: 14px;
    }
    button, input, select, textarea { font-family: inherit; }
    .layout { display: flex; min-height: 100vh; }
    .sidebar { width: 232px; background: var(--sidebar); color: rgba(255,255,255,.82); flex-shrink: 0; position: sticky; top: 0; height: 100vh; overflow: auto; overflow-x: hidden; transition: width .2s ease; }
    .brand { height: 58px; display:flex; align-items:center; gap: 10px; padding: 0 12px 0 20px; border-bottom: 1px solid rgba(255,255,255,.08); color: #fff; font-weight: 700; white-space: nowrap; }
    .brand-icon { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, #1677ff, #36cfc9); display:inline-flex; align-items:center; justify-content:center; flex: 0 0 30px; }
    .brand-text { overflow:hidden; text-overflow:ellipsis; }
    .sidebar-toggle { margin-left:auto; width: 30px; height: 30px; border: 0; border-radius: 8px; background: rgba(255,255,255,.08); color:#fff; cursor:pointer; display:grid; place-items:center; flex: 0 0 30px; }
    .sidebar-toggle:hover { background: rgba(255,255,255,.14); }
    .layout.sidebar-collapsed .sidebar { width: 68px; }
    .layout.sidebar-collapsed .brand { justify-content:flex-start; gap:0; padding: 0 4px; }
    .layout.sidebar-collapsed .brand-text, .layout.sidebar-collapsed .menu-section { display:none; }
    .layout.sidebar-collapsed .brand-icon { margin:0; }
    .layout.sidebar-collapsed .sidebar-toggle { box-shadow: 0 4px 14px rgba(0,0,0,.2); }
    .layout.sidebar-collapsed .menu { padding: 12px 8px 24px; }
    .layout.sidebar-collapsed .menu-item { justify-content:center; padding:0; gap:0; }
    .layout.sidebar-collapsed .menu-item .menu-label { display:none; }
    .layout.sidebar-collapsed .menu-icon { width:auto; font-size:18px; }
    .menu { padding: 12px 8px 24px; }
    .menu-section { color: rgba(255,255,255,.42); font-size: 12px; padding: 14px 12px 8px; }
    .menu-item { height: 40px; display:flex; align-items:center; gap: 10px; padding: 0 12px; border-radius: 8px; cursor:pointer; margin-bottom:4px; user-select: none; }
    .menu-item:hover { background: rgba(255,255,255,.06); color: #fff; }
    .menu-item.active { background: var(--sidebar-active); color:#fff; }
    .menu-icon { width: 20px; text-align:center; opacity: .9; }
    .main { flex: 1; min-width: 0; }
    .topbar { height: 58px; background: var(--card); border-bottom: 1px solid var(--line); display:flex; align-items:center; justify-content:space-between; padding: 0 24px; position: sticky; top: 0; z-index: 20; }
    .breadcrumb { color: var(--muted); font-size: 13px; }
    .breadcrumb span { color: var(--text); }
    .user { display:flex; align-items:center; gap:12px; color: var(--sub-text); }
    .avatar { width: 32px; height:32px; border-radius:50%; background: var(--blue-bg); color: var(--primary); display:grid; place-items:center; font-weight:700; }
    .content { padding: 22px 24px 44px; }
    .view { display:none; }
    .view.active { display:block; }
    .page-head { display:flex; align-items:flex-start; justify-content:space-between; gap: 16px; margin-bottom: 16px; }
    h1 { margin: 0; font-size: 24px; line-height: 34px; }
    h2, h3 { margin:0; }
    .desc { margin: 6px 0 0; color: var(--sub-text); line-height: 1.6; font-size: 13px; }
    .notice { border: 1px solid #c7d7fe; background: var(--blue-bg); color: #1e40af; border-radius: 10px; padding: 12px 14px; line-height: 1.65; margin-bottom: 16px; display:flex; gap: 10px; align-items:flex-start; }
    .notice.warning { border-color: #f8d98b; background: var(--orange-bg); color: #8a4a05; }
    .stats { display:grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
    .stat-card { background: var(--card); border:1px solid var(--line); border-radius: 12px; padding: 16px; box-shadow: var(--shadow); }
    .stat-label { color: var(--sub-text); font-size: 13px; display:flex; align-items:center; justify-content:space-between; gap: 8px; }
    .stat-num { margin-top: 8px; font-size: 28px; line-height: 34px; font-weight: 760; letter-spacing: -.02em; }
    .stat-note { margin-top: 5px; color: var(--muted); font-size: 12px; }
    .card { background: var(--card); border:1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); margin-bottom: 16px; overflow: hidden; }
    .card-hd { padding: 16px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap: 16px; }
    .card-title { font-weight: 700; font-size: 15px; }
    .card-bd { padding: 18px; }
    .toolbar { display:flex; gap: 10px; flex-wrap: wrap; align-items:center; }
    .filters { display:grid; grid-template-columns: 1.35fr 1fr 1fr 1fr auto auto; gap: 12px; align-items:end; }
    .field label { display:block; margin-bottom: 6px; color: var(--sub-text); font-size: 13px; }
    input, select, textarea { width:100%; border:1px solid #d9dde3; border-radius: 8px; padding: 0 10px; background:#fff; color: var(--text); outline: none; }
    input, select { height: 34px; }
    textarea { min-height: 86px; padding: 10px; resize: vertical; }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(22,119,255,.12); }
    .btn { border:1px solid var(--line); background:#fff; color: var(--text); height: 34px; padding: 0 14px; border-radius: 8px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap: 6px; font-size:14px; white-space:nowrap; }
    .btn:hover { border-color: var(--primary-hover); color: var(--primary); }
    .btn.primary { background: var(--primary); color:#fff; border-color: var(--primary); }
    .btn.primary:hover { background: var(--primary-hover); color:#fff; }
    .btn.text { border-color: transparent; background: transparent; padding: 0 5px; height: auto; color: var(--primary); }
    .btn.soft { background: var(--blue-bg); border-color: #c7d7fe; color:#1d4ed8; }
    .btn.warn { background: var(--orange-bg); border-color: #fed7aa; color:#b45309; }
    .btn:disabled { background:#f2f3f5; color:#b4b8bf; border-color:var(--line); cursor:not-allowed; }
    table { width:100%; border-collapse: collapse; }
    .table-wrap { overflow:auto; }
    th, td { padding: 12px 14px; border-bottom: 1px solid var(--line); text-align:left; vertical-align:middle; }
    th { background:#fafafa; color: var(--sub-text); font-size: 13px; font-weight:600; white-space:nowrap; }
    tr:hover td { background:#fbfdff; }
    .muted { color: var(--muted); }
    .sub { color: var(--sub-text); font-size: 12px; margin-top: 3px; line-height: 1.45; }
    .strong { font-weight: 700; }
    .tag { display:inline-flex; align-items:center; gap: 4px; height: 23px; padding: 0 8px; border-radius: 999px; font-size: 12px; margin: 2px 4px 2px 0; white-space:nowrap; font-weight:600; }
    .tag.blue { color: var(--primary); background: var(--blue-bg); }
    .tag.green { color:#389e0d; background: var(--green-bg); }
    .tag.orange { color:#d48806; background: var(--orange-bg); }
    .tag.red { color: var(--danger); background: var(--red-bg); }
    .tag.purple { color: var(--purple); background: var(--purple-bg); }
    .tag.gray { color: var(--sub-text); background: var(--gray-bg); }
    .priority { display:inline-flex; align-items:center; height: 24px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight:700; }
    .priority.high { color:#b42318; background: var(--red-bg); }
    .priority.mid { color:#b45309; background: var(--orange-bg); }
    .priority.low { color:#175cd3; background: var(--blue-bg); }
    .student-cell { display:flex; align-items:center; gap: 10px; min-width: 160px; }
    .student-avatar { width: 34px; height:34px; border-radius:50%; background: linear-gradient(135deg,#1677ff,#36cfc9); color:#fff; display:grid; place-items:center; font-weight:800; flex-shrink:0; }
    .progress { width: 116px; height: 7px; background: #edf0f5; border-radius: 999px; overflow:hidden; display:inline-block; vertical-align: middle; margin-right: 8px; }
    .progress i { display:block; height:100%; border-radius:999px; background: var(--primary); }
    .progress.green i { background: var(--success); }
    .progress.orange i { background: var(--warning); }
    .progress.red i { background: var(--danger); }
    .two-col { display:grid; grid-template-columns: 1.1fr .9fr; gap: 16px; align-items:start; }
    .three-col { display:grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .mini-card { border: 1px solid var(--line); background:#fbfcff; border-radius: 10px; padding: 14px; }
    .mini-card b { display:block; margin-bottom: 8px; }
    .mini-card span, .mini-card li { color: var(--sub-text); font-size: 13px; line-height: 1.6; }
    .queue { display:grid; gap: 10px; }
    .queue-item { border:1px solid var(--line); border-radius: 10px; padding: 13px; display:grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items:center; background:#fff; }
    .queue-item:hover { border-color:#b8ccff; background:#fbfdff; }
    .queue-main { min-width:0; }
    .queue-title { display:flex; align-items:center; gap: 8px; flex-wrap: wrap; }
    .queue-title b { font-size: 14px; }
    .queue-evidence { color: var(--sub-text); font-size: 12px; margin-top: 5px; line-height: 1.5; }
    .queue-actions { display:flex; gap: 6px; }
    .timeline { list-style:none; padding:0; margin:0; }
    .timeline li { position:relative; padding-left: 22px; padding-bottom: 14px; color: var(--sub-text); line-height: 20px; }
    .timeline li::before { content:''; position:absolute; left:4px; top:5px; width:8px; height:8px; border-radius:50%; background: var(--primary); }
    .timeline li::after { content:''; position:absolute; left:7px; top:16px; bottom:0; width:1px; background: var(--line); }
    .timeline li:last-child::after { display:none; }
    .timeline b { color: var(--text); }
    .drawer-mask { position:fixed; inset:0; background:rgba(0,0,0,.24); display:none; z-index:40; }
    .drawer-mask.open { display:block; }
    .drawer { position:fixed; top:0; right:-920px; width:920px; max-width: calc(100vw - 48px); height:100vh; background:#fff; z-index:50; box-shadow:-8px 0 28px rgba(16,24,40,.18); transition:right .22s ease; display:flex; flex-direction:column; }
    .drawer.open { right:0; }
    .drawer-hd { min-height:62px; padding: 12px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap: 16px; }
    .drawer-title { font-size: 18px; font-weight:700; }
    .drawer-bd { flex:1; overflow:auto; padding: 18px 20px; background:#f7f8fa; }
    .drawer-ft { min-height:58px; border-top:1px solid var(--line); display:flex; align-items:center; justify-content:flex-end; gap:10px; padding: 10px 20px; }
    .drawer-tabs { display:flex; border-bottom:1px solid var(--line); margin: 0 -20px 16px; padding: 0 20px; background:#fff; position:sticky; top:-18px; z-index: 2; }
    .drawer-tab { padding: 13px 0; margin-right: 24px; cursor:pointer; color: var(--sub-text); position:relative; }
    .drawer-tab.active { color: var(--primary); font-weight:700; }
    .drawer-tab.active::after { content:''; position:absolute; left:0; right:0; bottom:-1px; height:2px; background: var(--primary); }
    .drawer-pane { display:none; }
    .drawer-pane.active { display:block; }
    .detail-grid { display:grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; margin-bottom: 14px; }
    .detail { background:#fff; border:1px solid var(--line); border-radius:10px; padding: 13px; }
    .detail span { display:block; color: var(--muted); font-size: 12px; margin-bottom: 5px; }
    .detail b { font-size: 16px; }
    .modal-mask { display:none; position:fixed; inset:0; z-index:70; background: rgba(17,24,39,.48); align-items:center; justify-content:center; padding:22px; }
    .modal-mask.show { display:flex; }
    .modal { width: min(680px, 100%); max-height: 88vh; background:#fff; border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.25); overflow:hidden; display:flex; flex-direction:column; }
    .modal.small { width: min(480px,100%); }
    .modal-hd { height: 56px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; padding:0 18px; font-weight:700; }
    .modal-bd { padding: 18px; overflow:auto; }
    .modal-ft { min-height: 58px; border-top:1px solid var(--line); display:flex; align-items:center; justify-content:flex-end; gap:10px; padding: 10px 18px; background:#fafafa; }
    .close { border:0; background:transparent; font-size:24px; line-height:1; color: var(--muted); cursor:pointer; }
    .form-grid { display:grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-grid .full { grid-column: 1/-1; }
    .error { color: var(--danger); font-size: 13px; margin-top: 8px; display:none; }
    .error.show { display:block; }
    .toast { position:fixed; z-index:90; top:22px; left:50%; transform:translateX(-50%) translateY(-12px); opacity:0; pointer-events:none; color:#fff; background:#111827; border-radius:999px; padding: 12px 16px; box-shadow: var(--shadow); transition:.2s ease; }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    .empty-tip { padding: 32px; text-align:center; color: var(--muted); background:#fafafa; border:1px dashed var(--line); border-radius:10px; }
    .course-list { display:grid; gap:12px; }
    .course-detail-card { background:#fff; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
    .course-detail-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:14px 16px; border-bottom:1px solid var(--line); }
    .course-detail-title { font-weight:700; font-size:15px; line-height:1.5; }
    .course-detail-body { padding:14px 16px; display:grid; gap:12px; }
    .course-meta { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
    .course-meta-item { min-width:0; border-radius:8px; background:#f7f8fa; padding:9px 11px; line-height:1.5; }
    .course-meta-item span { display:block; color:var(--muted); font-size:12px; margin-bottom:2px; }
    .course-homework-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .course-homework { min-width:0; border:1px solid var(--line); border-radius:9px; padding:11px 12px; }
    .course-homework-label { color:var(--sub-text); font-size:12px; margin-bottom:7px; }
    .homework-state { display:flex; align-items:center; gap:8px; font-weight:700; line-height:1.4; }
    .homework-mark { width:24px; height:24px; flex:0 0 24px; border-radius:50%; display:grid; place-items:center; font-size:15px; font-weight:800; }
    .homework-mark.complete { color:#16803c; background:#dcfce7; }
    .homework-mark.incomplete { color:#c2413b; background:#fff1f0; }
    .homework-mark.pending { color:#667085; background:#f2f3f5; }
    .homework-mark.na { color:#667085; background:#f2f3f5; font-size:12px; }
    .course-feedback { border:1px solid #d7e7ff; background:#f5f9ff; border-radius:9px; padding:11px 12px; }
    .course-feedback-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:5px; }
    .course-feedback-text { color:var(--sub-text); font-size:13px; line-height:1.55; }
    .course-exception { border:1px solid #fed7aa; background:var(--orange-bg); color:#8a4a05; border-radius:8px; padding:9px 11px; font-size:13px; line-height:1.5; }
    .course-detail-actions { display:flex; justify-content:flex-end; }
    .metric-row { display:grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .chart-card { border:1px solid var(--line); border-radius:10px; padding:14px; background:#fff; }
    .meter { display:flex; flex-direction:column; gap: 9px; }
    .meter-row { display:grid; grid-template-columns: 82px 1fr 42px; gap:10px; align-items:center; font-size: 13px; }
    .bar { height: 9px; background:#edf0f5; border-radius:999px; overflow:hidden; }
    .bar i { display:block; height:100%; background: var(--primary); border-radius:999px; }
    .bar.orange i { background: var(--warning); }
    .bar.green i { background: var(--success); }
    .disabled-node { opacity:.55; }

    /* 工作台三栏布局 */
    .workbench { display:grid; grid-template-columns: minmax(430px, .92fr) minmax(360px, .78fr); gap:16px; align-items:start; }
    .workbench-main { min-width:0; }
    .workbench-side { min-width:0; position:sticky; top:78px; }
    .workbench-head { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:14px; }
    .workbench-head h1 { font-size:24px; }
    .workbench-date { color:var(--sub-text); font-size:13px; margin-top:5px; }
    .workbench-stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin-bottom:14px; }
    .workbench-stat { background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px 13px; box-shadow:0 4px 14px rgba(16,24,40,.04); }
    .workbench-stat span { color:var(--sub-text); font-size:12px; }
    .workbench-stat b { display:block; margin-top:5px; font-size:22px; line-height:1; }
    .workbench-stat.danger b { color:var(--danger); }
    .workbench-stat.warning b { color:#d97706; }
    .task-tabs { display:flex; gap:8px; overflow:auto; padding:2px 1px 10px; scrollbar-width:none; }
    .task-tabs::-webkit-scrollbar { display:none; }
    .task-tab { border:1px solid var(--line); background:#fff; color:var(--sub-text); border-radius:999px; height:31px; padding:0 12px; white-space:nowrap; cursor:pointer; font-size:12px; }
    .task-tab:hover, .task-tab.active { border-color:#b8ccff; color:var(--primary); background:var(--blue-bg); }
    .task-list { display:grid; gap:10px; }
    .task-student { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px; cursor:pointer; transition:.16s ease; box-shadow:0 4px 14px rgba(16,24,40,.035); }
    .task-student:hover, .task-student.selected { border-color:#9dbbff; box-shadow:0 7px 20px rgba(22,119,255,.1); }
    .task-student.selected { background:#fbfdff; }
    .task-student-top { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
    .task-student-id { display:flex; gap:10px; align-items:center; min-width:0; }
    .task-student-id .student-avatar { width:38px; height:38px; }
    .task-student-id b { display:block; font-size:15px; }
    .task-student-id .sub { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .task-count { color:var(--primary); background:var(--blue-bg); border-radius:999px; padding:4px 8px; font-size:12px; font-weight:700; white-space:nowrap; }
    .task-primary { margin:12px 0 10px; padding:10px 11px; border-radius:9px; background:#f8fafc; border-left:3px solid var(--primary); }
    .task-primary.overdue { background:var(--red-bg); border-left-color:var(--danger); }
    .task-primary-title { display:flex; align-items:center; gap:7px; flex-wrap:wrap; font-weight:700; }
    .task-primary-title .due { color:var(--sub-text); font-size:12px; font-weight:500; }
    .task-primary.overdue .due { color:var(--danger); font-weight:700; }
    .task-evidence { color:var(--sub-text); font-size:12px; line-height:1.5; margin-top:5px; }
    .task-student-foot { display:flex; align-items:center; justify-content:space-between; gap:10px; color:var(--muted); font-size:12px; }
    .task-student-foot .quick-metrics { display:flex; gap:10px; flex-wrap:wrap; }
    .task-student-actions { display:flex; gap:6px; }
    .context-card { background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; box-shadow:0 6px 22px rgba(16,24,40,.06); }
    .context-head { padding:18px; background:linear-gradient(135deg,#f6f9ff 0%,#fff 72%); border-bottom:1px solid var(--line); }
    .context-identity { display:flex; align-items:center; gap:11px; }
    .context-identity .student-avatar { width:44px; height:44px; font-size:16px; }
    .context-identity b { font-size:18px; }
    .context-identity .sub { margin-top:4px; }
    .context-body { padding:16px; }
    .context-section { padding-bottom:16px; margin-bottom:16px; border-bottom:1px solid var(--line); }
    .context-section:last-child { padding-bottom:0; margin-bottom:0; border-bottom:0; }
    .context-section-title { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; font-size:13px; font-weight:700; }
    .context-task { border:1px solid #c7d7fe; background:#f7faff; border-radius:10px; padding:12px; }
    .context-task.overdue { border-color:#fecaca; background:#fff7f7; }
    .context-task-title { display:flex; align-items:center; gap:7px; flex-wrap:wrap; font-weight:700; }
    .guide-list { list-style:none; padding:0; margin:0; display:grid; gap:8px; }
    .guide-list li { display:flex; gap:8px; color:var(--sub-text); line-height:1.5; font-size:13px; }
    .guide-list li::before { content:counter(item); counter-increment:item; width:20px; height:20px; flex:0 0 20px; display:grid; place-items:center; color:var(--primary); background:var(--blue-bg); border-radius:50%; font-size:11px; font-weight:700; }

    .context-metrics { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
    .context-metric { background:#f7f8fa; border-radius:8px; padding:10px; }
    .context-metric span { display:block; color:var(--muted); font-size:11px; margin-bottom:4px; }

    .empty-context { padding:48px 20px; text-align:center; color:var(--muted); }

    @media (max-width: 1180px) {
      .workbench { grid-template-columns: 1fr; }
      .workbench-side { position:static; }

      openTasks().filter(taskFilterMatch).forEach(t => {

      });

      const statusScore = t => t.status === '逾期' ? 0 : t.priority === 'high' ? 1 : t.priority === 'mid' ? 2 : 3;

t-metric"><span>CC 老师</span><b>${s.cc || '待分配'}</b></div></div></section><section class="context-section"><div class="context-section-title"><span>最近 Follow</span><button class="btn text" onclick="openContactModal('${s.id}','新增 Follow')">+ 新增</button></div><ul class="context-notes">${s.notes.slice(0,3).map(n=>`<li><b>${n.time} · ${n.title}</b><br>${n.text}</li>`).join('')}</ul></section></div></div>`;

    function switchDrawerTab(tab) { state.drawerTab = tab; renderDrawer(); }
    function homeworkStatusHtml(item) {
      if (!item || item.status === '-') return `<div class="homework-state"><span class="homework-mark na">—</span><span>${item?.name || '未安排'}</span></div>`;
      const complete = item.status === '已完成';
      const pending = item.status === '待完成';
      const markClass = complete ? 'complete' : pending ? 'pending' : 'incomplete';
      const mark = complete ? '✓' : pending ? '…' : '×';
      const label = complete ? '已完成' : pending ? '待完成' : '未完成';
      return `<div class="homework-state"><span class="homework-mark ${markClass}" aria-hidden="true">${mark}</span><span>${label}</span></div><div class="sub">${item.name}</div>`;
    }
    function courseDetailCardHtml(s,c,i) {
      const statusClass = c.status === '已上课' ? 'green' : c.status === '已请假' ? 'orange' : c.status === '未约课' ? 'red' : 'blue';
      const exception = c.exception ? `<div class="course-exception"><b>异常提醒：</b>${c.exception}</div>` : '';
      const feedback = c.feedback
        ? `<div class="course-feedback"><div class="course-feedback-head"><b>课堂反馈</b><span class="tag green">已填写</span></div><div class="course-feedback-text">${c.feedback}</div></div>`
        : c.status === '已上课'
          ? `<div class="course-feedback"><div class="course-feedback-head"><b>课堂反馈</b><span class="tag orange">待填写</span></div><div class="course-feedback-text">本节课暂无老师反馈，联系家长或老师跟进。</div></div>`
          : '';
      const actions = c.status === '已上课'
        ? `<button class="btn text" onclick="openContactModal('${s.id}','课堂反馈跟进')">联系跟进</button>`
        : c.status === '未约课'
          ? `<button class="btn primary" onclick="openScheduleModal('${s.id}')">帮学生约课</button>`
          : '';
      return `<article class="course-detail-card"><div class="course-detail-head"><div><div class="course-detail-title">${c.title}</div><div class="sub">${c.lessonNo || '课次待确认'}</div></div><span class="tag ${statusClass}">${c.status}</span></div><div class="course-detail-body"><div class="course-meta"><div class="course-meta-item"><span>上课时间</span><b>${c.time}</b></div><div class="course-meta-item"><span>授课老师</span><b>${c.teacher}</b></div></div><div class="course-homework-grid"><div class="course-homework"><div class="course-homework-label">课前作业</div>${homeworkStatusHtml(c.preClass)}</div><div class="course-homework"><div class="course-homework-label">课后作业</div>${homeworkStatusHtml(c.postClass)}</div></div>${feedback}${exception}${actions ? `<div class="course-detail-actions">${actions}</div>` : ''}</div></article>`;
    }
    function drawerPaneHtml(s) {
      if (state.drawerTab === 'overview') return `<div class="drawer-pane active"><div class="detail-grid"><div class="detail"><span>课包剩余</span><b>${s.hoursLeft}/${s.hoursTotal} 课时</b></div><div class="detail"><span>下一个节点</span><b>${s.nextNode}</b></div><div class="detail"><span>企微绑定</span><b>${s.wecom}</b></div><div class="detail"><span>作业完成率</span><b>${s.study.homework}%</b></div><div class="detail"><span>本月上课</span><b>${s.reward.qinxue}/${s.reward.target} 节</b></div><div class="detail"><span>经营状态</span><b>${s.order.intention}</b></div></div><section class="card"><div class="card-hd"><div class="card-title">当前待办</div></div><div class="card-bd"><div class="queue">${state.tasks.filter(t=>t.studentId===s.id && t.status!=='已完成').map(t=>`<div class="queue-item"><div><span class="priority ${priorityClass(t.priority)}">${priorityText(t.priority)}</span></div><div><b>${t.type}</b><div class="queue-evidence">${t.evidence}<br>${t.action}</div></div><button class="btn primary" onclick="openContactModal('${s.id}','${t.type}')">处理</button></div>`).join('') || '<div class="empty-tip">暂无未完成待办</div>'}</div></div></section></div>`;
      if (state.drawerTab === 'study') return `<div class="drawer-pane active"><div class="detail-grid"><div class="detail"><span>到课节数</span><b>${s.study.attendance}</b></div><div class="detail"><span>课前预习完成率</span><b>${s.study.preview}%</b></div><div class="detail"><span>连续覆盖天数</span><b>${s.study.days} 天</b></div></div><section class="card"><div class="card-hd"><div><div class="card-title">课程记录</div></div><span class="tag blue">${s.courses.length} 条课程</span></div><div class="card-bd"><div class="course-list">${s.courses.map((c,i)=>courseDetailCardHtml(s,c,i)).join('')}</div></div></section></div>`;
      if (state.drawerTab === 'records') return `<div class="drawer-pane active"><section class="card"><div class="card-hd"><div class="card-title">家长联系时间线</div><button class="btn primary" onclick="openContactModal('${s.id}','新增联系')">+ 新增记录</button></div><div class="card-bd"><ul class="timeline">${s.notes.map(n=>`<li><b>${n.time}｜${n.title}</b><br>${n.text}</li>`).join('')}</ul></div></section></div>`;
      if (state.drawerTab === 'nodes') return `<div class="drawer-pane active"><section class="card"><div class="card-hd"><div class="card-title">服务节点</div></div><table><thead><tr><th>节点</th><th>状态</th><th>截止</th><th>说明</th><th>操作</th></tr></thead><tbody>${s.nodes.map(n=>nodeRowHtml(s,n)).join('')}</tbody></table></section></div>`;
      if (state.drawerTab === 'rewards') return `<div class="drawer-pane active"><div class="detail-grid"><div class="detail"><span>海报任务</span><b>${s.reward.poster}</b></div><div class="detail"><span>勤学奖进度</span><b>${s.reward.qinxue}/${s.reward.target}</b></div><div class="detail"><span>当前判断</span><b>${s.reward.gift}</b></div></div></div>`;
      return `<div class="drawer-pane active"><section class="card"><div class="card-hd"><div class="card-title">订单与课包</div></div><div class="card-bd"><div class="detail-grid"><div class="detail"><span>最新订单</span><b>${s.order.latest}</b></div><div class="detail"><span>补差状态</span><b>${s.order.buCha}</b></div><div class="detail"><span>经营意向</span><b>${s.order.intention}</b></div></div></div></section></div>`;
    }

    function showModal(html, small=false) { $('#modal').className = 'modal' + (small ? ' small' : ''); $('#modal').innerHTML = html; $('#modalMask').classList.add('show'); }
    function closeModal() { $('#modalMask').classList.remove('show'); }
    $('#modalMask').addEventListener('click', e => { if (e.target === $('#modalMask')) closeModal(); });

    function openContactModal(studentId, source) {
      const s = studentById(studentId);
      showModal(`<div class="modal-hd">联系家长并记录结果 <button class="close" onclick="closeModal()">×</button></div><div class="modal-bd"><div class="notice"><span>📞</span><div><b>${s.name}｜${source}</b></div></div><div class="form-grid"><div class="field"><label>联系渠道</label><select id="contactChannel"><option>电话</option><option>企微</option><option>微信</option><option>短信</option></select></div><div class="field"><label>沟通结果</label><select id="contactResult"><option>已沟通并达成下一步</option><option>家长未接通</option><option>待家长反馈</option><option>已解决问题</option></select></div><div class="field full"><label>沟通备注</label><textarea id="contactNote" placeholder="例如：已提醒本周约课；家长反馈周五可上课；已同步补差优惠信息。"></textarea><div class="error" id="contactError">请填写沟通备注，便于后续跟进</div></div><div class="field"><label>下次跟进时间</label><input id="nextTime" type="datetime-local" value="2026-09-25T19:30"></div><div class="field"><label>待办处理</label><select id="taskPolicy"><option>完成该学生相关待办</option><option>保留待办，设置下次跟进</option></select></div></div></div><div class="modal-ft"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="submitContact('${studentId}','${source}')">提交记录</button></div>`);
    }

    function submitContact(studentId, source) {
      const note = $('#contactNote').value.trim();
      if (!note) { $('#contactError').classList.add('show'); return; }
      const s = studentById(studentId);
      const channel = $('#contactChannel').value;
      const result = $('#contactResult').value;
      s.notes.unshift({ time:'刚刚', title:`${channel}｜${source}`, text:`${result}：${note}；下次跟进 ${$('#nextTime').value.replace('T',' ')}` });
      if ($('#taskPolicy').value.includes('完成')) state.tasks.forEach(t => { if (t.studentId === studentId && (t.type === source || source === '快速记录' || source === '档案跟进' || source === '列表跟进' || source === '新增联系')) t.status = '已完成'; });
      closeModal(); renderAll(); if ($('#studentDrawer').classList.contains('open')) renderDrawer(); toast('✅ 已记录联系结果，并同步更新待办状态');
    }

    function openScheduleModal(studentId) {
      const s = studentById(studentId);
      showModal(`<div class="modal-hd">帮学生约课 <button class="close" onclick="closeModal()">×</button></div><div class="modal-bd"><div class="notice"><span>📚</span><div><b>${s.name}</b></div></div><div class="form-grid"><div class="field"><label>推荐课程</label><select id="courseName"><option>自然拼读下一单元</option><option>口语主题课</option><option>绘本精读课</option></select></div><div class="field"><label>上课时间</label><input id="courseTime" type="datetime-local" value="2026-09-27T19:30"></div><div class="field"><label>推荐老师</label><select><option>沿用原老师</option><option>系统推荐老师</option><option>家长指定老师</option></select></div><div class="field"><label>课前提醒</label><select><option>需要课前提醒</option><option>无需提醒</option></select></div></div></div><div class="modal-ft"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="submitSchedule('${studentId}')">确认约课</button></div>`);
    }
    function submitSchedule(studentId) {
      const s = studentById(studentId);
      s.courses.push({ title: $('#courseName').value, lessonNo:'课次待分配', time: $('#courseTime').value.replace('T',' '), status:'已约课', teacher:'待确认', preClass:{status:'待完成',name:'课前预习'}, postClass:{status:'-',name:'课程完成后生成'}, feedback:'', exception:'' });
      closeModal(); renderAll(); if ($('#studentDrawer').classList.contains('open')) renderDrawer(); toast('✅ 已新增约课记录');
    }

    function openIntentModal(studentId) {
      const s = studentById(studentId);
      showModal(`<div class="modal-hd">记录补差 / 续费意向 <button class="close" onclick="closeModal()">×</button></div><div class="modal-bd"><div class="form-grid"><div class="field"><label>意向类型</label><select id="intentType"><option>补差高意向</option><option>续费待沟通</option><option>暂不考虑</option><option>待家长反馈</option></select></div><div class="field"><label>下一步时间</label><input type="datetime-local" value="2026-09-26T20:00"></div><div class="field full"><label>备注</label><textarea id="intentNote" placeholder="记录家长关心点、报价口径、需要谁协助等"></textarea></div></div></div><div class="modal-ft"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="submitIntent('${studentId}')">保存意向</button></div>`);
    }
    function submitIntent(studentId) {
      const s = studentById(studentId);
      s.order.intention = $('#intentType').value;
      s.notes.unshift({ time:'刚刚', title:'经营意向记录', text: `${s.order.intention}：${$('#intentNote').value || '已记录下一步跟进。'}` });
      closeModal(); renderAll(); if ($('#studentDrawer').classList.contains('open')) renderDrawer(); toast('✅ 已保存补差/续费意向');
    }

    function updateCourse(studentId, index) {
      const s = studentById(studentId);
      const c = s.courses[index];
      if (c.postClass?.status && c.postClass.status !== '-') {
        c.postClass.status = c.postClass.status === '已完成' ? '未完成' : '已完成';
      } else if (c.preClass?.status && c.preClass.status !== '-') {
        c.preClass.status = c.preClass.status === '已完成' ? '未完成' : '已完成';
      } else {
        toast('当前课程暂无可更新的作业状态');
        return;
      }
      if (c.postClass.status === '已完成') c.exception = '';
      renderAll(); if ($('#studentDrawer').classList.contains('open')) renderDrawer(); toast('✅ 已更新课前/课后作业状态');
    }
    function completeNode(studentId, nodeName) {
      const s = studentById(studentId);
      const n = s.nodes.find(x => x.name === nodeName);
      if (n) { n.status = '已完成'; n.due = '刚刚完成'; s.notes.unshift({ time:'刚刚', title:`服务节点：${nodeName}`, text:'已记录处理结果，后续按下次跟进时间继续服务。' }); }
      state.tasks.forEach(t => { if (t.studentId === studentId && (t.type === nodeName || nodeName.includes(t.type) || t.type.includes(nodeName))) t.status = '已完成'; });
      renderAll(); if ($('#studentDrawer').classList.contains('open')) renderDrawer(); toast('✅ 服务节点已完成');
    }

    function filterTaskType(type) { state.filter.taskType = type; renderDashboard(); }
    function resetStudentFilter() { state.filter.keyword = ''; state.filter.risk = '全部'; state.filter.wecom = '全部'; state.filter.package = '全部'; renderStudents(); }
    function switchView(id) {
      state.currentView = id;
      $$('.view').forEach(v => v.classList.toggle('active', v.id === id));
      $$('.menu-item').forEach(m => m.classList.toggle('active', m.dataset.view === id));
      $('#crumb').textContent = viewNames[id];
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    function toast(msg) { const el = $('#toast'); el.textContent = msg; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 2400); }

    $('#sidebarToggle').addEventListener('click', () => {
      const collapsed = $('#layout').classList.toggle('sidebar-collapsed');
      $('#sidebarToggle').textContent = collapsed ? '›' : '‹';
      $('#sidebarToggle').title = collapsed ? '展开侧边栏' : '收起侧边栏';
      $('#sidebarToggle').setAttribute('aria-label', collapsed ? '展开侧边栏' : '收起侧边栏');
      $$('.menu-item').forEach(item => { item.title = collapsed ? item.querySelector('.menu-label').textContent : ''; });
    });
    $$('.menu-item').forEach(item => {
      item.addEventListener('click', () => switchView(item.dataset.view));
      item.title = $('#layout').classList.contains('sidebar-collapsed') ? item.querySelector('.menu-label').textContent : '';
    });
    renderAll();
  </script>
</body>
</html>
